# ═══════════════════════════════════════════════════════════════════════════
# CI — the net for native-dep / Node-version compatibility (ADR 0020).
#
# The only ABI-bound surface is native modules (better-sqlite3 — onnxruntime
# ships broad prebuilds). This matrix builds the engine and runs the suites
# across the supported Node window, on macOS AND Windows (parity — ADR 0015),
# so a Node/native-dep conflict goes red HERE instead of at a colleague's
# install (the Yann DANOT wall that motivated v3.0.1).
#
# The `install-e2e` job additionally runs `installer.mjs` END-TO-END on Windows —
# the path where the spawn-correctness bugs (EINVAL on npm/npx `.cmd` shims, the
# multi-line `cmd /c` rag-install) lived invisibly because no job ever executed the
# installer itself (Daniel Martin wall, 2026-06-21 — ADR 0031, plan
# windows-install-reliability). A clean exit + populated rag/node_modules is the
# assertion those bugs would have failed.
# ═══════════════════════════════════════════════════════════════════════════
name: CI

on:
  # `push` on ANY branch, so the `early-windows` tripwire can fire while a branch is
  # still being written — the whole point (see that job). The expensive jobs below
  # carry an `if` restricting them to pull requests and to `main`, so an ordinary
  # branch push costs ONE short Windows job, not the whole matrix.
  push:
  pull_request:

jobs:
  # ── The early Windows tripwire (ADR 0015 / CONVENTIONS §9) ──────────────────
  # Why this exists, and why it is NOT redundant with the matrix below: §9 names the
  # CI matrix as the *deterministic* net for POSIX-invisible defects, but the matrix
  # only ever fired on `pull_request` and on pushes to `main`. Our PRs open at the END
  # of a release, so the net could not fire while the work was happening — a branch
  # would reach 50+ commits before Windows ever spoke, and the same class of defect
  # (a fixture path spelled with `/` where production `join`s) came back every few
  # releases. Caught late, it is a red release; caught here, it is 40 seconds.
  #
  # Deliberately ONE cell and ONE step: the harness suites are dependency-free .mjs,
  # so this needs no `npm ci` and no native build. It is a tripwire, not a matrix —
  # the full 7/7 arbiter below still gates the merge.
  early-windows:
    name: Windows tripwire · harness
    # Branch pushes only: on a pull_request the full matrix already covers this step,
    # and on `main` the merge has already been arbitrated.
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Harness tests
        run: node --test "scripts/*.test.mjs" "scripts/lib/*.test.mjs" "rag/*.test.mjs"

  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Harness suites — pure .mjs seams (node:test), no deps to install.
      # `rag/*.test.mjs` belongs here, NOT in the engine job: the postinstall "message in a
      # bottle" is dependency-free .mjs, so rag's `npm test` (tsx over src/lib/*.test.ts) never
      # globbed it and it was running nowhere.
      - name: Harness tests
        run: node --test "scripts/*.test.mjs" "scripts/lib/*.test.mjs" "rag/*.test.mjs"

      # Maintainer tooling (dev-only, never copied into a brain): the mutation
      # runner's own suite. macOS only, deliberately — mutate-one.mjs is a
      # maintainer's machine tool (git worktree + Stryker + POSIX path fixtures)
      # that is never run on Windows, so the cross-OS matrix has nothing to say
      # about it. Without this step its tests would run in no job at all.
      - name: Maintainer tooling tests
        if: runner.os == 'macOS'
        run: node --test "maintainers/mutation/*.test.mjs"

      # Engine — `npm ci` builds the native binding (better-sqlite3) on this
      # exact Node; the test run then exercises it. This is the real net.
      - name: Install engine (builds native binding)
        working-directory: rag
        run: npm ci

      # The vault write-guard suite, run a SECOND time — this time with `rag/node_modules`
      # present. Four of its assertions run the ENGINE'S OWN parser (gray-matter + js-yaml,
      # resolved from rag/) because a lookalike parser would measure a fiction (F16), so
      # they SKIP in the harness step above, whose invariant is "no deps to install".
      # Without this step they skip everywhere and assert nothing — which is exactly how
      # they shipped green-only-on-a-developer-machine, unnoticed for 67 commits.
      # Pinned from the suite itself (`vault-write-guard.test.mjs`, last test), so deleting
      # this step goes red instead of going quiet.
      - name: Vault write-guard tests (with the engine's own parser)
        run: node --test "scripts/lib/vault-write-guard.test.mjs" "scripts/vault-write-guard.test.mjs"

      - name: Engine tests
        working-directory: rag
        run: npm test

      - name: Type-check engine
        working-directory: rag
        run: npx tsc --noEmit

      # Local-mirror — TS/ESM via tsx, no native binding. `npm ci` then the suite,
      # so the MCP mirror package is covered cross-platform like the engine is.
      - name: Install local-mirror deps
        working-directory: local-mirror
        run: npm ci

      - name: Local-mirror tests
        working-directory: local-mirror
        run: npm test

      - name: Type-check local-mirror
        working-directory: local-mirror
        run: npx tsc --noEmit

  # The net for the INSTALLER path itself (Bugs 1 & 2): nothing here built a brain
  # end-to-end before, so spawn-correctness bugs on Windows stayed invisible. We run
  # the real non-interactive install on windows-latest, then assert the RAG deps
  # actually landed. Node 22 = the floor (ADR 0020); the spawn EINVAL is
  # Node-version-insensitive across the window, so one cell suffices.
  #
  # Embedder = `gemini` WITHOUT a key (not `in-process`): the bugs this job proves live
  # in the SPAWN path (prereq npm/npx `.cmd` shims, the rag-install `.cmd`, the MCP
  # smoke `npx.cmd`) — all of which run regardless of embedder, BEFORE indexing. The
  # `gemini`-no-key path defers the initial index (`embedderReady` is false) instead of
  # forcing an `in-process` ONNX weight download + CPU inference that hangs for tens of
  # minutes on the Windows runner (G2). So this still exercises the exact spawn surface
  # Bugs 1 & 2 broke, keeps the job fast + deterministic, and the populated
  # `rag/node_modules/better-sqlite3` assertion is unchanged. CI=true makes the
  # gemini-no-key path skip the editor pop + Obsidian register, so it exits 0 headless.
  # `timeout-minutes` is the belt against a future spawn-site hang regressing silently.
  install-e2e:
    name: Installer e2e · windows-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22 (the supported floor)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure a git identity (the brain runs `git init` + an auto-commit hook)
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@example.com"

      - name: Run installer.mjs end-to-end (non-interactive, gemini embedder, no key → indexing deferred)
        run: node installer.mjs --non-interactive --name ci-brain --dest "${{ runner.temp }}" --owner "CI" --lang en --embedder gemini

      - name: Assert the RAG dependencies were installed (Bugs 1 & 2 would leave this empty)
        shell: pwsh
        run: |
          $dir = Join-Path "${{ runner.temp }}" "ci-brain\rag\node_modules\better-sqlite3"
          if (-not (Test-Path $dir)) { Write-Error "rag/node_modules/better-sqlite3 missing — RAG deps not installed"; exit 1 }
          Write-Host "rag/node_modules populated - install path is healthy"
